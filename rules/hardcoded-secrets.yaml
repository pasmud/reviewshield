rules:
- id: no-hardcoded-secrets
  patterns:
  - pattern-either:
    - pattern: '$PASSWORD = "..."'
    - pattern: '$SECRET = "..."'
    - pattern: '$API_KEY = "..."'
    - pattern: '$TOKEN = "..."'
    - pattern: 'password = "..."'
    - pattern: 'secret = "..."'
    - pattern: 'api_key = "..."'
    - pattern: 'token = "..."'
    - pattern: 'process.env.$VAR'
  severity: HIGH
  message: >
    Potential hardcoded secret detected. Use environment variables or
    a secrets manager instead of hardcoding credentials.
  languages:
  - javascript
  - typescript
  - python
  metadata:
    owasp: A02:2021 - Cryptographic Failures
    cwe: CWE-798
    confidence: MEDIUM
